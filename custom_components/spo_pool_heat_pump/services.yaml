start_dump:
  name: Start bus dump
  description: Capture raw RS-485 bytes from the DR164 in the rs485_dump format. Duration is seconds; 0 runs until the 40 MB session cap or Stop.
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 0
          max: 7200
          unit_of_measurement: s
    note:
      required: false
      example: pressed Cool
      selector:
        text:
    include_writes:
      required: false
      example: true
      selector:
        boolean:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: spo_pool_heat_pump
    device_id:
      required: false
      selector:
        device:
          integration: spo_pool_heat_pump

stop_dump:
  name: Stop bus dump
  description: Stop the running RS-485 capture and close the files.
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: spo_pool_heat_pump
    device_id:
      required: false
      selector:
        device:
          integration: spo_pool_heat_pump
