refresh_service_menu:
  name: Refresh service menu
  description: One-shot read of the service-menu settings pages (1001 / 1091 / 1181).
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: spo_pool_heat_pump
    device_id:
      required: false
      selector:
        device:
          integration: spo_pool_heat_pump

set_service_menu:
  name: Set service setting
  description: Write one service-menu parameter. Requires the service-menu writes option.
  fields:
    key:
      required: true
      example: h06_min_freq_heat
      selector:
        select:
          options:
            - d01_bar_defrost_start_pressure
            - d01_defrost_start_ct
            - d02_defrost_stop_ct
            - d03_defrost_cycle_min
            - d04_defrost_max_min
