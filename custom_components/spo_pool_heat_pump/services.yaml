            - d07_slip_defrost_start_at
            - d08_bar_slip_defrost_pressure_dev
            - d08_slip_defrost_ct_dev
            - d09_slip_defrost_at_dev
            - d10_bar_slip_defrost_min_pressure
            - d10_slip_defrost_min_coil
            - data_refresh_time
            - e01_eev_mode
            - e02_eev_overheat_set
            - e03_eev_init_steps
            - e04_eev_min_steps
            - e05_eev_defrost_steps
            - e06_eev_cool_steps
            - e07_eev_exhaust_set
            - e09_eev_p
            - e10_eev_i
            - e11_eev_d
            - e12_eev_max_overheat_compen
            - f01_fan_mode
            - f02_bar_cool_max_fan_pressure
            - f02_cool_max_fan_temp
            - f03_bar_cool_min_fan_pressure
            - f03_cool_min_fan_temp
            - f04_bar_cool_fan_stop_pressure
            - f04_cool_fan_stop_temp
            - f05_bar_heat_max_fan_pressure
            - f05_heat_max_fan_temp
            - f06_bar_heat_min_fan_pressure
            - f06_heat_min_fan_temp
            - f07_bar_heat_fan_stop_pressure
            - f07_heat_fan_stop_temp
            - f10_fan_control_mode
            - f11_heat_max_duty
            - f11_r_heat_max_fan_rpm
            - f12_cool_max_duty
            - f12_r_cool_max_fan_rpm
            - f13_heat_min_duty
            - f13_r_heat_min_fan_rpm
            - f16_r_silent_fan_rpm
            - f16_silent_duty
            - f18_manual_fan_speed_enable
            - f19_ac_fan_rated_duty
            - f19_r_dc_fan_rated_rpm
            - f20_pwm_or_antifreeze_temp
            - h06_min_freq_heat
            - h07_min_freq_cool
